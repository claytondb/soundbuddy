<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ecdc4"/>
      <stop offset="100%" style="stop-color:#44a08d"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="url(#bg)"/>
  
  <!-- Sound wave circles -->
  <circle cx="20" cy="32" r="16" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.3"/>
  <circle cx="20" cy="32" r="22" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.2"/>
  <circle cx="20" cy="32" r="28" fill="none" stroke="url(#accent)" stroke-width="1" opacity="0.1"/>
  
  <!-- Speaker icon -->
  <rect x="10" y="26" width="10" height="12" rx="2" fill="url(#accent)"/>
  <polygon points="20,26 32,18 32,46 20,38" fill="url(#accent)"/>
  
  <!-- Sound bars (equalizer) -->
  <rect x="40" y="28" width="4" height="8" rx="2" fill="#4ecdc4" opacity="0.9"/>
  <rect x="46" y="22" width="4" height="20" rx="2" fill="#4ecdc4" opacity="0.8"/>
  <rect x="52" y="26" width="4" height="12" rx="2" fill="#4ecdc4" opacity="0.7"/>
</svg>
